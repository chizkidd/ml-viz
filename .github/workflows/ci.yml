name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy for td-lambda cross-check
        run: python3 -m pip install --quiet numpy
      - name: Rebuild, check drift, and run all tests
        run: sh scripts/check.sh --check-clean
